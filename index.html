<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete do Zé</title>
</head>
<body>
    <header>
        <img src="/src/img/logo do seu ze.png" alt="logo do seu ze">
        <h1>Lanche do Zé</h1>
        <nav>
            <ul>
                <li><a href="#promocoes">Promoções</a></li>
                <li><a href="#lanches">Lanches</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="promocoes">
            <img src="/src/img/x-salada.png" alt="X-Salada">
            <p>De R$ 15,99 por R$ 12,00</p>
            <button>Comprar</button>
        </section>

        <section id="lanches">
            <div id="x-baicon">
                <img src="/src/img/x-baicon.png" alt="X-Baicon">
                <p>R$ 15,99</p>
                <button>Comprar</button>
            </div>

            <div id="x-calabresa">
                <img src="/src/img/x-calabresa.png" alt="x-calabresa">
                <p>R$ 16,99</p>
                <button>Comprar</button>
            </div>
        </section>
        <section id="contatos">
            <p>Contato: (11) 99999-9999</p>
            <p>Email: contato@lanchetedoze.com</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Lanchonete do Zé. Todos os direitos reservados.</p>
    </footer>
</body>     
</html>
